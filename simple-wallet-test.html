<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Wallet Test</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1); }
        .btn { background: #2ecc71; color: white; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; font-size: 16px; margin: 10px; }
        .btn:hover { background: #27ae60; }
        .status { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔗 Simple Wallet Connection Test</h1>
        
        <div id="status" class="status info">Checking wallet availability...</div>
        
        <button class="btn" onclick="checkWallet()">Check Wallet</button>
        <button class="btn" onclick="connectWallet()">Connect Wallet</button>
        
        <div id="result" style="margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 5px; font-family: monospace; white-space: pre-wrap;"></div>
    </div>

    <script>
        function log(message) {
            console.log(message);
            const result = document.getElementById('result');
            result.textContent += new Date().toLocaleTimeString() + ': ' + message + '\n';
        }
        
        function updateStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + type;
        }
        
        function checkWallet() {
            log('Checking wallet availability...');
            
            // Check if window.solana exists
            if (typeof window.solana === 'undefined') {
                updateStatus('❌ Phantom wallet not detected', 'error');
                log('ERROR: window.solana is undefined');
                log('Please install Phantom wallet from https://phantom.app');
                return false;
            }
            
            // Check if it's Phantom
            if (!window.solana.isPhantom) {
                updateStatus('❌ Not Phantom wallet', 'error');
                log('ERROR: window.solana.isPhantom is false');
                return false;
            }
            
            updateStatus('✅ Phantom wallet detected!', 'success');
            log('SUCCESS: Phantom wallet is available');
            return true;
        }
        
        async function connectWallet() {
            log('Attempting to connect wallet...');
            
            if (!checkWallet()) {
                return;
            }
            
            try {
                log('Calling window.solana.connect()...');
                const response = await window.solana.connect();
                
                log('SUCCESS: Wallet connected!');
                log('Public Key: ' + response.publicKey.toString());
                log('Connected: ' + response.publicKey.toString().substring(0, 8) + '...');
                
                updateStatus('✅ Wallet connected successfully!', 'success');
                
            } catch (error) {
                log('ERROR: ' + error.message);
                updateStatus('❌ Connection failed: ' + error.message, 'error');
            }
        }
        
        // Auto-check on page load
        window.addEventListener('load', function() {
            log('Page loaded');
            setTimeout(checkWallet, 1000);
        });
    </script>
</body>
</html>
